[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slackwater-lattice"
version = "0.1.0"
description = "Exact integer arithmetic on the Eisenstein A₂ hexagonal lattice for build placement and pathfinding"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Eileen"}]
keywords = ["eisenstein", "lattice", "hexagonal", "placement", "pathfinding", "roblox"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["slackwater_lattice*"]
